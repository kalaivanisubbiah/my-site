<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Abstract Kalai</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER + NAV -->
  <header class="site-header">
    <a class="brand" href="index.html">The Musings of Kalai unfiltered</a>
    <nav aria-label="Main">
      <ul class="nav-list">
        <li><a href="#">Who am I</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Book recommendations</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">

    <!-- HERO -->
    <section class="blog-hero">
      <h1><!-- blog title --></h1>
      <p class="intro">Documenting the detours, the discoveries, and everything in between</p>
    </section>

    <div class="layout">

      <!-- POSTS -->
      <section id="posts">
        <h2 class="section-title"><!-- posts heading --></h2>

        <article class="post">
          <p class="post-meta"><time datetime=""><!-- date --></time></p>
          <h3><a href="#"><!-- post title --></a></h3>
          <p><!-- post summary --></p>
        </article>
        <!-- copy the article above for each post -->
      </section>

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <section class="author">
          <figure class="portrait">
            <img src="" alt="" />
          </figure>
          <h2><!-- about heading --></h2>
          <p><!-- short bio --></p>
        </section>

        <section>
          <h2><!-- topics heading --></h2>
          <ul class="topics-list">
            <li><!-- topic --></li>
          </ul>
        </section>

      </aside>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p><!-- copyright / contact --></p>
  </footer>

</body>
</html>
