<section class="blog-hero" id="home">
  <div class="hero-text">
    <h2>Welcome</h2>
    <p class="intro">Documenting the detours, the discoveries, and everything in between</p>
  </div>
  <figure class="hero-image">
    <img src="banner.jpg" alt="The abyss" />
  </figure>
</section>
<section id="posts">
  <h2 class="section-title">Latest posts</h2>

  <article class="post">
    <p class="post-meta"><time datetime="2026-10-09">9 October 2026</time></p>
    <h3><a href="#">My first post</a></h3>
    <p>A short summary of what this post is about.</p>
  </article>
</section>
<section id="contact" class="contact">
  <h2 class="section-title">Contact</h2>

  <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">Send message</button>
  </form>
</section>
<li><a href="#contact">Contact</a></li>
